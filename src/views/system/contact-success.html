<!DOCTYPE html>

<html class="dark" lang="en"><head>

                        "secondary-fixed-dim": "#4edea3",
                        "on-error-container": "#ffdad6",

                        "on-tertiary-container": "#003235",
                        "inverse-primary": "#a63b00",

<style>
        .glow-success {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
        }
        .pulse-success {
            animation: pulse-success 2s infinite;
        }
        @keyframes pulse-success {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-surface-near-black text-on-surface min-h-screen flex items-center justify-center font-body-lg">
<!-- Abstract grid background effect -->
<div class="fixed inset-0 pointer-events-none opacity-20" style="background-image: linear-gradient(to right, #1F2223 1px, transparent 1px), linear-gradient(to bottom, #1F2223 1px, transparent 1px); background-size: 64px 64px;"></div>
<main class="relative z-10 w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-16 flex flex-col items-center justify-center text-center">
<!-- Icon Container -->
<div class="mb-12 relative flex items-center justify-center w-32 h-32 rounded-full bg-surface-container border border-white/10 glow-success pulse-success">
<span class="material-symbols-outlined text-6xl text-success-green" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<!-- Decorative outer ring -->
<div class="absolute inset-0 rounded-full border border-success-green/20 scale-110"></div>
<div class="absolute inset-0 rounded-full border border-success-green/10 scale-125"></div>
</div>
<!-- Content -->
<div class="flex flex-col items-center gap-6 max-w-lg">
<h1 class="font-display-lg text-display-lg text-on-surface">
                Transmission <br/> <span class="text-success-green">Confirmed</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center leading-relaxed">
                Your inquiry has been encrypted and sent to our engineering team. A specialist will initiate synchronization within 24 hours.
            </p>
<!-- Technical Data / Status -->
<div class="mt-4 flex items-center gap-4 bg-surface-container-high border border-white/5 px-6 py-3 rounded-lg">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-success-green animate-pulse"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Status:</span>
</div>
<span class="font-data-mono text-data-mono text-success-green">ENCRYPTED_AND_DELIVERED</span>
</div>
</div>
<!-- Action -->
<div class="mt-16 w-full max-w-sm">
<a class="group flex items-center justify-center w-full py-4 px-8 bg-brand-orange text-surface-near-black font-title-md text-title-md rounded-lg transition-all duration-300 hover:shadow-[0_0_12px_rgba(255,95,0,0.4)] hover:bg-[#ff7b2e]" href="/">
                Return to Command Center
                <span class="material-symbols-outlined ml-2 transition-transform duration-300 group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</a>
<div class="mt-6 flex justify-center">
<a class="text-tertiary font-body-sm text-body-sm hover:text-ai-glow transition-colors border-b border-transparent hover:border-ai-glow pb-1" href="/support">
                    Need immediate assistance?
                </a>
</div>
</div>
</main>
<script>
        // Simple entry animation
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(20px)';
            main.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
            
            setTimeout(() => {
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
